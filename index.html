<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compteur de Billard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a4314;
            color: white;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation; /* Évite le délai de double-clic sur mobile */
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin: 0 0 5px 0;
        }
        .score-top-box {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .score-bottom-box {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 12px;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .score-total {
            font-size: 1.2rem;
            text-align: center;
            color: #ffd700;
            font-weight: bold;
        }
        .score-final {
            font-size: 1.8rem;
            text-align: center;
            color: #a3e635;
            font-weight: bold;
        }
        .ajustement-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
            color: #e0e0e0;
            margin: 5px 0;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 4px;
        }
        .ajustement-label-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-weight: bold;
        }
        .ajustement-val {
            color: #ff9800;
        }
        /* Style du slider pour le tactile */
        .slider-touch {
            width: 100%;
            height: 15px;
            border-radius: 5px;
            background: #444;
            outline: none;
            -webkit-appearance: none;
            margin: 10px 0 5px 0;
        }
        .slider-touch::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #ff9800;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .slider-touch::-moz-range-thumb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #ff9800;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .manches-header-row {
            display: grid;
            grid-template-columns: 1fr 1.8fr 0.8fr 0.8fr 0.8fr;
            padding: 5px 10px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #aaa;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 5px;
        }
        .manche-card {
            display: grid;
            grid-template-columns: 1fr 1.8fr 0.8fr 0.8fr 0.8fr;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 4px;
            padding: 6px 10px;
            border-radius: 4px;
            border-left: 3px solid #4caf50;
        }
        .manche-info {
            font-size: 0.9rem;
        }
        .manche-info span {
            display: block;
            font-size: 0.75rem;
            color: #bbb;
        }
        .counter-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .btn-touch {
            width: 32px;
            height: 32px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            background-color: #4caf50;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .btn-touch:active {
            background-color: #388e3c;
        }
        .billes-val {
            min-width: 24px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .input-cell {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .cb-touch-label {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            cursor: pointer;
        }
        .cb-foul input {
            accent-color: #ff4d4d;
            width: 22px;
            height: 22px;
        }
        .cb-za {
            visibility: hidden;
        }
        .cb-za input {
            accent-color: #ff9800;
            width: 22px;
            height: 22px;
        }
        .score-manche {
            text-align: right;
            font-weight: bold;
            color: #a3e635;
            font-size: 1.1rem;
        }
        .btn-reset {
            display: block;
            width: 100%;
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s;
        }
        .btn-reset:hover {
            background-color: #b71c1c;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Score Billard</h1>
    
    <!-- Uniquement le Score Final en haut -->
    <div class="score-top-box">
        <div class="score-final">Score Final : <span id="final-score">0</span> pts</div>
    </div>
    
    <div class="manches-header-row">
        <div>Manche</div>
        <div style="text-align: center;">Billes</div>
        <div style="text-align: center;">Foul</div>
        <div style="text-align: center;">ZA</div>
        <div style="text-align: right;">Score</div>
    </div>
    
    <div id="manches-list"></div>
    
    <!-- Ajustement et Points Bruts déplacés ici tout en bas -->
    <div class="score-bottom-box">
        <div class="score-total">Points Bruts : <span id="total">0</span> pts</div>
        
        <div class="ajustement-group">
            <div class="ajustement-label-row">
                <span>AJUSTEMENT :</span>
                <span class="ajustement-val"><span id="ajustement-txt">0</span>%</span>
            </div>
            <input type="range" id="ajustement-slider" class="slider-touch" min="-50" max="50" value="0" step="5" oninput="calculerScore()">
        </div>
    </div>
    
    <button class="btn-reset" onclick="reinitialiserPartie()">Réinitialiser la partie</button>
</div>

<script src="script.js"></script>

</body>
</html>
