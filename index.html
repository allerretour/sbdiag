<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compteur de Billard Premium</title>
    <style>
        :root {
            --bg-dark: #121824;
            --card-bg: #1e2640;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-gold: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #161f33;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Header & Dashboard de Score */
        .header-score {
            text-align: center;
            background: linear-gradient(135deg, #1e2942 0%, #0f172a 100%);
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .header-score h1 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin: 0 0 5px 0;
        }

        .final-score-display {
            font-size: 60px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1;
            margin: 8px 0;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .raw-score {
            font-size: 12px;
			text-align: right;
            color: var(--text-muted);
        }

        /* Slider d'ajustement */
        .adjustment-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .adjustment-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .adjustment-label span:last-child {
            color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.15);
            padding: 2px 8px;
            border-radius: 20px;
        }

                .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 5px;
            background: #334155;
            outline: none;
            transition: background 0.3s ease; /* Ajoute un effet de fondu fluide */
        }


        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        /* Liste des Manches */
        .manches-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .manche-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 4px 16px;
            display: grid;
            grid-template-columns: 1.2fr 1.5fr 1fr 1fr 0.8fr;
            align-items: center;
            gap: 2px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .manche-info {
            font-weight: 700;
            font-size: 14px;
        }

        .manche-info span {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 400;
            margin-top: 2px;
        }

        /* Boutons de contrôle tactiles */
        .counter-group {
            display: flex;
            align-items: center;
            background: #13192b;
            border-radius: 8px;
            padding: 3px;
            justify-content: space-between;
        }

        .btn-touch {
            background: #2e3757;
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-touch:active {
            background: var(--accent-blue);
        }

        .billes-val {
            font-size: 16px;
            font-weight: 700;
            min-width: 20px;
            text-align: center;
        }

        /* Checkboxes stylisées en boutons d'action */
        .input-cell {
            display: flex;
            justify-content: center;
        }

        .cb-touch-label {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.2s;
            border: 2px solid transparent;
            user-select: none;
        }

        .cb-touch-label input {
            display: none;
        }

        /* Style Bouton Foul (Blanche) */
        .cb-foul {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border-color: rgba(239, 68, 68, 0.2);
        }
        .cb-foul::before { content: "F"; }
        .cb-foul:has(input:checked) {
            background: var(--accent-red);
            color: white;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }

        /* Style Bouton ZA (Zone d'Arrivée) */
        .cb-za {
            background: rgba(245, 158, 11, 0.1);
            color: var(--accent-gold);
            border-color: rgba(245, 158, 11, 0.2);
        }
        .cb-za::before { content: "ZA"; }
        .cb-za:has(input:checked) {
            background: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
        }

        /* Colonne Score Final par Manche */
        .score-manche {
            text-align: right;
            font-size: 30px;
            font-weight: 700;
            color: var(--accent-green);
        }

        /* Bouton Réinitialiser */
        .btn-reset {
            width: 100%;
            background: #27314f;
            color: #f8fafc;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-reset:hover {
            background: #334166;
        }
		
		/* Transition douce pour les changements de couleur de la ligne */
        .manche-card {
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        /* Style si la ligne est FOUL (Accent rouge subtil) */
        .manche-card.manche-foul {
            background-color: rgba(239, 68, 68, 0.15) !important;
            border-color: rgba(239, 68, 68, 0.4) !important;
        }

        /* Style si la ligne est PARFAITE + ZA (Accent vert subtil) */
        .manche-card.manche-parfaite {
            background-color: rgba(16, 185, 129, 0.15) !important;
            border-color: rgba(16, 185, 129, 0.4) !important;
        }
		
		/* Style si la ligne contient des points normaux (Accent jaune subtil) */
        .manche-card.manche-encours {
            background-color: rgba(245, 158, 11, 0.1) !important;
            border-color: rgba(245, 158, 11, 0.3) !important;
        }
		
		
    </style>
</head>
<body>

        <div class="container">
        <!-- Dashboard des Scores -->
        <div class="header-score">
            <h1>Carte de pointage</h1>
            <div class="final-score-display"><span id="final-score">0</span><span style="font-size: 24px; color:var(--text-muted);"> pts</span></div>
            <div class="raw-score">Points Bruts : <span id="total">0</span> pts</div>
        </div>

        <!-- Grille des Manches (générée par script.js) -->
        <div class="manches-container" id="manches-list"></div>

        <!-- Section Ajustement / Handicap (DÉPLACÉE EN BAS) -->
        <div class="adjustment-section">
            <div class="adjustment-label">
                <span>Ajustement</span>
                <span id="ajustement-txt">0%</span>
            </div>
            <input type="range" id="ajustement-slider" class="slider" min="-50" max="50" value="0" oninput="calculerScore()">
        </div>

        <!-- Action principale -->
        <button class="btn-reset" onclick="reinitialiserPartie()">Réinitialiser la partie</button>
    </div>


    <!-- Liaison avec le fichier script.js -->
    <script src="script.js"></script>
</body>
</html>
